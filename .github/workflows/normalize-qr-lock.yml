name: Normalize QR lockfile

on:
  push:
    branches:
      - feat/qr-code-component

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/qr-code-component
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve existing resolver entries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          lines = path.read_text().splitlines()
          targets = {
              'apps/studio': '        version: 16.3.5(eslint@9.39.5(jiti@2.7.0))(typescript@5.9.3)',
              'packages/create-framekit': '        version: 16.3.5(@typescript-eslint/parser@8.64.0(eslint@9.39.5(jiti@2.7.0))(typescript@5.9.3))(eslint@9.39.5(jiti@2.7.0))(typescript@5.9.3)',
          }
          importer = None
          dependency = None
          for index, line in enumerate(lines):
              if line.startswith('  ') and not line.startswith('    ') and line.endswith(':'):
                  importer = line.strip()[:-1]
                  dependency = None
                  continue
              if line.startswith('      ') and not line.startswith('        ') and line.endswith(':'):
                  dependency = line.strip()[:-1]
                  continue
              if importer in targets and dependency == 'eslint-config-next' and line.startswith('        version:'):
                  lines[index] = targets[importer]
                  dependency = None

          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit lockfile normalization
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: preserve existing lockfile resolutions"
          git push origin HEAD:feat/qr-code-component
